name: Release

# Cut a release by pushing a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match `version` in pyproject.toml — the job checks and refuses
# otherwise, before it builds anything.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install and build tooling
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[dev]'

      # `r2d2box.__version__` is read from the installed metadata rather than
      # written out a second time, so this compares the tag against pyproject
      # and confirms the number survives packaging.
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          mod="$(python -c 'import r2d2box; print(r2d2box.__version__)')"
          echo "tag=$tag  pyproject=$proj  __version__=$mod"
          if [ "$tag" != "$proj" ] || [ "$tag" != "$mod" ]; then
            echo "::error::tag v$tag must match pyproject ($proj) and r2d2box.__version__ ($mod)"
            exit 1
          fi

      - name: Run tests
        run: |
          pytest
          node tests/js/run.js

      - name: Build sdist and wheel
        run: python -m build

      # The browser half ships as package data, not as Python modules, so a
      # packaging mistake yields a wheel that installs and imports perfectly and
      # then serves a 404 for every asset the page loads.
      - name: Verify the front-end is in the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          for f in r2d2box/static/r2d2box.js \
                   r2d2box/static/r2d2box.css \
                   r2d2box/static/vendor/marked.min.js \
                   r2d2box/static/vendor/purify.min.js; do
            unzip -l "$wheel" | grep -q " $f\$" || {
              echo "::error::$wheel is missing $f"; exit 1; }
          done
          echo "$wheel carries the front-end"

      # Use the runner's gh CLI (no third-party action / Node runtime) to publish.
      - name: Create the GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
