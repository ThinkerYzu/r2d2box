name: Release

# A version tag publishes the validated artifacts to PyPI and GitHub.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.15"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Verify release identity
        run: python tools/check_release.py "$GITHUB_REF_NAME"
      - name: Install locked development environment
        run: uv sync --locked --extra dev --python 3.11
      - name: Verify installed version and run tests
        run: |
          uv run --locked python -c 'import os, r2d2box; assert "v" + r2d2box.__version__ == os.environ["GITHUB_REF_NAME"]'
          uv run --locked pytest
          node tests/js/run.js
      - name: Build and check distributions
        run: |
          uv build --no-sources
          python tools/check_release.py "$GITHUB_REF_NAME" --dist dist
          uvx --from twine twine check --strict dist/*
      - name: Verify clean wheel and source installations
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            target="$(mktemp -d)"
            uv venv --python 3.11 "$target/venv"
            uv pip install --python "$target/venv/bin/python" "$artifact" pytest pytest-asyncio
            "$target/venv/bin/python" tools/smoke_install.py "${GITHUB_REF_NAME#v}"
            "$target/venv/bin/python" -m pytest
          done
      - name: Verify uv tool installation
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/release-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/release-bin
        run: |
          uv tool install --python 3.11 dist/*.whl
          "$UV_TOOL_BIN_DIR/r2d2box" --version
          "$UV_TOOL_DIR/r2d2box/bin/python" tools/smoke_install.py "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/r2d2box/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist
      - name: Publish with Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  github:
    name: Publish GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: distributions
          path: dist
      - name: Create GitHub Release with the same distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "r2d2box $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
