name: CI

# The default suite never launches an agent CLI:
# every layer is tested against a stand-in for the one below it. The tests that
# do need them are marked `live` and opt in through R2D2BOX_RUN_LIVE, so a
# plain `pytest` skips them.
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.15"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --locked pytest

      # pytest runs the front-end's tests too, but skips them when `node` is
      # missing — so the suite would stay green with the browser half entirely
      # untested. Here a missing `node` is a failure.
      - name: Run the front-end tests, where a missing node is an error
        run: node tests/js/run.js
